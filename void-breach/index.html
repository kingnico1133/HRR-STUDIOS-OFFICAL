<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="VOID BREACH — Roguelike top-down shooter. Survive 12 waves, then fight on in Endless mode." />
  <title>VOID BREACH</title>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { position:fixed; inset:0; width:100%; height:100%; background:#000; overflow:hidden; display:flex; justify-content:center; align-items:center; font-family:'Courier New', monospace; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none; }
    #gameCanvas { display:block; cursor:none; image-rendering:auto; touch-action:none; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    (async () => {
      try {
        const sdk = window.CrazyGames && window.CrazyGames.SDK;
        if (sdk) {
          await sdk.init();
          window.__cgInited = true;
          if (sdk.environment === 'local' || sdk.environment === 'crazygames') {
            sdk.game.loadingStart();
            window.__cgLoadStarted = true;
          }
        }
      } catch (e) { console.warn('[CG] SDK init failed – running standalone', e); }
      const s = document.createElement('script');
      s.src = 'game.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
